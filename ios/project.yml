# Proyecto Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# En una Mac:  brew install xcodegen && cd ios && xcodegen
# y abre CalmaDetector.xcodeproj.
name: CalmaDetector

options:
  bundleIdPrefix: com.example.calma
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pon aquí tu Team ID de Apple Developer (o elígelo en Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  CalmaCore:
    path: Packages/CalmaCore

targets:
  # App de iPhone (incluye dentro la app del reloj).
  CalmaPhone:
    type: application
    platform: iOS
    sources:
      - Phone
      - Shared
    dependencies:
      - package: CalmaCore
      - target: CalmaWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: CalmaDetector
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.calma
        PRODUCT_NAME: CalmaDetector
        TARGETED_DEVICE_FAMILY: "1"

  # App de Apple Watch (SwiftUI, un solo target).
  CalmaWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    dependencies:
      - package: CalmaCore
      - sdk: HealthKit.framework
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: CalmaDetector
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.calma
        # Permite seguir leyendo el pulso con la muñeca bajada mientras está en modo "Sensores".
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: CalmaDetector lee tu frecuencia cardíaca y su variabilidad para detectar estrés en reposo.
        NSHealthUpdateUsageDescription: CalmaDetector inicia una sesión de "Mente y cuerpo" para poder leer el pulso en tiempo real. No guarda entrenamientos.
        NSMotionUsageDescription: CalmaDetector usa el movimiento para no confundir ejercicio con estrés.
    entitlements:
      path: Watch/CalmaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.calma.watchkitapp
        PRODUCT_NAME: CalmaDetector
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  CalmaPhone:
    build:
      targets:
        CalmaPhone: all
        CalmaWatch: all
    run:
      config: Debug
  CalmaWatch:
    build:
      targets:
        CalmaWatch: all
    run:
      config: Debug
